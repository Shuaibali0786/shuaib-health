name: Frontend and browsers
description: Node 24, npm ci, and the Playwright browsers the e2e suites use.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install
      shell: bash
      working-directory: frontend
      run: |
        npm ci
        npx playwright install --with-deps chromium webkit
