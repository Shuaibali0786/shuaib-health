name: Frontend and browsers
description: Node 24, npm ci, and the Playwright browsers the e2e suites use.

inputs:
  system-deps:
    description: Install the browsers' system packages (false inside the Playwright container, which has them)
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install
      shell: bash
      working-directory: frontend
      run: |
        npm ci
        if [ "${{ inputs.system-deps }}" = "true" ]; then
          npx playwright install --with-deps chromium webkit
        else
          npx playwright install chromium webkit
        fi
