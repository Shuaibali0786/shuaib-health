[project]
name = "clinic-backend"
version = "0.1.0"
description = "Read-only clinic catalog API (single-tenant, white-label)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142,<0.143",
    "sqlmodel==0.0.47",
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.3,<3.4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.13,<3",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<0.17",
    "mypy>=2.4,<3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs TEST_DATABASE_URL",
    "perf: performance check, run on demand",
]
addopts = "-m 'not perf' -ra"
