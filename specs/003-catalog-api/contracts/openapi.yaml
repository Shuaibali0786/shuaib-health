openapi: 3.1.0
info:
  title: Clinic Catalog API
  version: 1.2.0
  description: >
    Public, read-only catalog API (Feature 003). Single-tenant: every clinic value comes from the
    database. Field names and types match frontend/src/types/content.ts; fields marked
    "additive" are new and optional for existing clients. All prices are whole PKR. Schedule
    times are wall-clock "HH:MM" in the clinic's timeZone.

    Every response carries X-Request-ID and security headers. Catalog 200 responses carry
    ETag and Cache-Control: public, max-age=300; a matching If-None-Match returns 304.
    Every /api/v1 endpoint is rate limited per IP (default 60/min) and may return 429.

    Availability and booking (Feature 005). Instants are UTC ISO 8601 ("Z"); every instant is
    accompanied by localDate / localTime in the clinic timeZone. Slot and booking responses are
    never cached (Cache-Control: no-store). POST /appointments is a server-to-server call: it
    requires X-Proxy-Secret, and X-Client-IP is honoured only with a valid secret.

    Command Centre (Feature 006). Every /api/v1/admin/* operation (tag command-centre) is called only by the
    website server: it requires X-Proxy-Secret, all but sign-in and demo start also require X-Session-Token,
    and state-changing operations (and POST /admin/bookings/search) require X-CSRF-Token. Responses are
    Cache-Control: no-store and X-Robots-Tag: noindex. The access policy of each operation is `x-policy`
    (see specs/006-clinic-command-centre/contracts/auth-matrix.md).
tags:
  - name: command-centre
    description: Staff dashboard and demo API (Feature 006); website server only.

servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Liveness (no database access, not rate limited)
      responses:
        "200": { description: Alive, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /ready:
    get:
      summary: Readiness (database reachable, migrations at head)
      responses:
        "200": { description: Ready, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/clinic:
    get:
      summary: Clinic settings (white-label)
      responses:
        "200": { description: OK, headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicSettings" } } } }
        "304": { $ref: "#/components/responses/NotModified" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/clinic/rules:
    get:
      summary: Active clinic rules in display order
      parameters: [ { $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/pageSize" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicRulePage" } } } }
        "304": { $ref: "#/components/responses/NotModified" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/departments:
    get:
      summary: List departments
      parameters: [ { $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/pageSize" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DepartmentPage" } } } }
        "304": { $ref: "#/components/responses/NotModified" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/departments/{slug}:
    get:
      summary: Department by slug
      parameters: [ { $ref: "#/components/parameters/slug" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Department" } } } }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/doctors:
    get:
      summary: List doctors
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - { name: department, in: query, description: Department slug; unknown slug gives an empty page, schema: { $ref: "#/components/schemas/Slug" } }
        - $ref: "#/components/parameters/q"
        - { name: day, in: query, description: Doctors with at least one session on this weekday, schema: { $ref: "#/components/schemas/Weekday" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DoctorPage" } } } }
        "304": { $ref: "#/components/responses/NotModified" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/doctors/{slug}:
    get:
      summary: Doctor by slug, with weekly schedule
      parameters: [ { $ref: "#/components/parameters/slug" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Doctor" } } } }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/lab-test-categories:
    get:
      summary: Lab test categories in display order
      parameters: [ { $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/pageSize" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LabTestCategoryPage" } } } }
        "304": { $ref: "#/components/responses/NotModified" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/lab-tests:
    get:
      summary: List lab tests
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/q"
        - { name: category, in: query, description: Category slug; unknown slug gives an empty page, schema: { $ref: "#/components/schemas/Slug" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LabTestPage" } } } }
        "304": { $ref: "#/components/responses/NotModified" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/lab-tests/{slug}:
    get:
      summary: Lab test by slug
      parameters: [ { $ref: "#/components/parameters/slug" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LabTest" } } } }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/health-packages:
    get:
      summary: List health packages
      parameters: [ { $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/pageSize" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HealthPackagePage" } } } }
        "304": { $ref: "#/components/responses/NotModified" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/health-packages/{slug}:
    get:
      summary: Health package by slug, with included tests
      parameters: [ { $ref: "#/components/parameters/slug" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HealthPackageDetail" } } } }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/doctors/{slug}/slots:
    get:
      summary: Available slots for one doctor, per clinic day, within the booking window
      parameters:
        - $ref: "#/components/parameters/slug"
        - name: from
          in: query
          required: false
          description: First clinic-local date (default today; earlier dates are clamped to today)
          schema: { type: string, format: date }
        - name: days
          in: query
          required: false
          description: Number of days (default and maximum = clinic booking window)
          schema: { type: integer, minimum: 1, maximum: 60 }
      responses:
        "200": { description: OK (Cache-Control no-store), content: { application/json: { schema: { $ref: "#/components/schemas/DoctorSlots" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/appointments:
    post:
      summary: Book one slot (idempotent)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Proxy-Secret
          in: header
          required: true
          schema: { type: string }
        - name: X-Client-IP
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentCreate" } } }
      responses:
        "201": { description: Booked, or replay of the original result for the same key, content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentView" } } } }
        "400": { description: "request_rejected (generic; trap field filled)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "forbidden (missing or wrong proxy secret)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: >
            slot_taken (lost the race or overlapping booking) | slot_unavailable (past, inside lead
            time, leave, holiday, outside window, off-grid) | booking_limit_reached (max active
            bookings for this mobile) | idempotency_key_reused (same key, different details).
            alternatives is present for slot_taken and slot_unavailable.
          content: { application/json: { schema: { $ref: "#/components/schemas/BookingConflict" } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/appointments/{reference}:
    get:
      summary: Masked confirmation view by booking reference (rate limited per IP)
      parameters:
        - name: reference
          in: path
          required: true
          description: 10 Crockford base32 characters; case-insensitive; one dash allowed
          schema: { type: string, pattern: "^[0-9A-Za-z]{5}-?[0-9A-Za-z]{5}$" }
      responses:
        "200": { description: OK (Cache-Control no-store), content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentView" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/auth/sign-in:
    post:
      tags: [command-centre]
      operationId: adminSignIn
      x-policy: PUBLIC_PROXY
      security: [ { proxySecret: [] } ]
      description: Ends any presented session first (fixation). Limits per IP (429 rate_limited) and per typed email (429 account_locked).
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SignInRequest" } } } }
      responses:
        "200": { description: signed in, content: { application/json: { schema: { $ref: "#/components/schemas/SessionIssued" } } } }
        "401": { description: "sign_in_failed (generic)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/AdminRateLimited" }
  /api/v1/admin/demo/start:
    post:
      tags: [command-centre]
      operationId: adminDemoStart
      x-policy: PUBLIC_PROXY
      security: [ { proxySecret: [] } ]
      description: Creates a 2-hour read-only demo session for today's Karachi date. Ends any presented session first.
      responses:
        "200": { description: demo session, content: { application/json: { schema: { $ref: "#/components/schemas/SessionIssued" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/AdminRateLimited" }
  /api/v1/admin/auth/me:
    get:
      tags: [command-centre]
      operationId: adminMe
      x-policy: SELF
      security: [ { proxySecret: [], sessionToken: [] } ]
      responses:
        "200": { description: current viewer, content: { application/json: { schema: { $ref: "#/components/schemas/Viewer" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/admin/auth/sign-out:
    post:
      tags: [command-centre]
      operationId: adminSignOut
      x-policy: SELF
      security: [ { proxySecret: [], sessionToken: [], csrfToken: [] } ]
      responses:
        "204": { description: session ended }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/auth/change-password:
    post:
      tags: [command-centre]
      operationId: adminChangePassword
      x-policy: SELF_STAFF
      security: [ { proxySecret: [], sessionToken: [], csrfToken: [] } ]
      description: Ends all of the staff member's sessions and issues a fresh one.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChangePasswordRequest" } } } }
      responses:
        "200": { description: new session, content: { application/json: { schema: { $ref: "#/components/schemas/SessionIssued" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/admin/lookups:
    get:
      tags: [command-centre]
      operationId: adminLookups
      x-policy: READ
      security: [ { proxySecret: [], sessionToken: [] } ]
      responses:
        "200": { description: filter options incl. inactive records, content: { application/json: { schema: { $ref: "#/components/schemas/Lookups" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/overview:
    get:
      tags: [command-centre]
      operationId: adminOverview
      x-policy: READ
      security: [ { proxySecret: [], sessionToken: [] } ]
      responses:
        "200": { description: "today at a glance; polled every 30 s while visible (FR-041)", content: { application/json: { schema: { $ref: "#/components/schemas/Overview" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/bookings/search:
    post:
      tags: [command-centre]
      operationId: adminBookingSearch
      x-policy: READ
      security: [ { proxySecret: [], sessionToken: [], csrfToken: [] } ]
      description: A read sent as POST so personal search terms never appear in a URL (FR-021). Default = today, all doctors, all statuses.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BookingSearchRequest" } } } }
      responses:
        "200": { description: page of bookings, content: { application/json: { schema: { $ref: "#/components/schemas/BookingPage" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/admin/bookings/{reference}:
    get:
      tags: [command-centre]
      operationId: adminBookingDetail
      x-policy: READ
      security: [ { proxySecret: [], sessionToken: [] } ]
      parameters: [ { $ref: "#/components/parameters/Reference" } ]
      responses:
        "200": { description: detail (phone and email masked), content: { application/json: { schema: { $ref: "#/components/schemas/BookingDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: not_found }
  /api/v1/admin/bookings/{reference}/status:
    post:
      tags: [command-centre]
      operationId: adminBookingChangeStatus
      x-policy: WRITE
      security: [ { proxySecret: [], sessionToken: [], csrfToken: [] } ]
      parameters: [ { $ref: "#/components/parameters/Reference" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StatusChangeRequest" } } } }
      responses:
        "200": { description: changed (booking + status history + audit in one transaction), content: { application/json: { schema: { $ref: "#/components/schemas/StatusChangeResult" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: not_found }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/admin/bookings/{reference}/status/undo:
    post:
      tags: [command-centre]
      operationId: adminBookingUndoStatus
      x-policy: WRITE
      security: [ { proxySecret: [], sessionToken: [], csrfToken: [] } ]
      parameters: [ { $ref: "#/components/parameters/Reference" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UndoRequest" } } } }
      responses:
        "200": { description: restored, content: { application/json: { schema: { $ref: "#/components/schemas/BookingDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "undo_unavailable / slot_taken", content: { application/json: { schema: { $ref: "#/components/schemas/BookingChanged" } } } }
  /api/v1/admin/bookings/{reference}/reveal-phone:
    post:
      tags: [command-centre]
      operationId: adminBookingRevealPhone
      x-policy: READ
      security: [ { proxySecret: [], sessionToken: [], csrfToken: [] } ]
      description: Staff → audit row booking.phone_revealed (reference only). Demo → synthetic number, nothing stored.
      parameters: [ { $ref: "#/components/parameters/Reference" } ]
      responses:
        "200": { description: full phone, content: { application/json: { schema: { $ref: "#/components/schemas/PhoneReveal" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: not_found }
  /api/v1/admin/insights:
    get:
      tags: [command-centre]
      operationId: adminInsights
      x-policy: READ
      security: [ { proxySecret: [], sessionToken: [] } ]
      parameters: [ { name: range, in: query, required: true, schema: { type: integer, enum: [7, 30, 90] } } ]
      responses:
        "200": { description: charts data, content: { application/json: { schema: { $ref: "#/components/schemas/Insights" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/admin/doctors-today:
    get:
      tags: [command-centre]
      operationId: adminDoctorsToday
      x-policy: READ
      security: [ { proxySecret: [], sessionToken: [] } ]
      responses:
        "200": { description: who is in today, content: { application/json: { schema: { $ref: "#/components/schemas/DoctorsToday" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/activity:
    get:
      tags: [command-centre]
      operationId: adminActivity
      x-policy: READ_ADMIN
      security: [ { proxySecret: [], sessionToken: [] } ]
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: staffId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200": { description: newest first (demo → synthetic feed), content: { application/json: { schema: { $ref: "#/components/schemas/ActivityPage" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/staff:
    get:
      tags: [command-centre]
      operationId: adminStaffList
      x-policy: READ_ADMIN
      security: [ { proxySecret: [], sessionToken: [] } ]
      responses:
        "200": { description: staff accounts (demo → synthetic), content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Staff" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [command-centre]
      operationId: adminStaffCreate
      x-policy: WRITE_ADMIN
      security: [ { proxySecret: [], sessionToken: [], csrfToken: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StaffCreate" } } } }
      responses:
        "201": { description: created (must change password at first sign-in), content: { application/json: { schema: { $ref: "#/components/schemas/Staff" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: email_taken }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/admin/staff/{staffId}/reset-password:
    post:
      tags: [command-centre]
      operationId: adminStaffResetPassword
      x-policy: WRITE_ADMIN
      security: [ { proxySecret: [], sessionToken: [], csrfToken: [] } ]
      parameters: [ { name: staffId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [temporaryPassword], properties: { temporaryPassword: { type: string, minLength: 12, maxLength: 128 } } } } } }
      responses:
        "204": { description: reset; all of that person's sessions ended }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: not_found }
        "422": { $ref: "#/components/responses/Validation" }
  /api/v1/admin/staff/{staffId}:
    patch:
      tags: [command-centre]
      operationId: adminStaffUpdate
      x-policy: WRITE_ADMIN
      security: [ { proxySecret: [], sessionToken: [], csrfToken: [] } ]
      description: Change role and/or active flag. Deactivation ends all sessions. Refuses to leave zero active admins (409 last_admin).
      parameters: [ { name: staffId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, minProperties: 1, properties: { role: { $ref: "#/components/schemas/Role" }, isActive: { type: boolean } } } } } }
      responses:
        "200": { description: updated, content: { application/json: { schema: { $ref: "#/components/schemas/Staff" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: not_found }
        "409": { description: last_admin }

components:
  securitySchemes:
    proxySecret: { type: apiKey, in: header, name: X-Proxy-Secret }
    sessionToken: { type: apiKey, in: header, name: X-Session-Token }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token }
  parameters:
    page: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
    pageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    q: { name: q, in: query, description: Case-insensitive contains; % and _ are literal, schema: { type: string, minLength: 1, maxLength: 60 } }
    slug: { name: slug, in: path, required: true, schema: { $ref: "#/components/schemas/Slug" } }
    Reference:
      name: reference
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{10}$" }
      description: Booking reference without dash (Crockford base32).
  headers:
    ETag:
      description: Weak ETag on every catalog 200
      schema: { type: string }
    CacheControl:
      description: Cache-Control on every catalog 200
      schema: { type: string }
  responses:
    NotModified: { description: If-None-Match matched; no body }
    NotFound: { description: Unknown or inactive slug, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    ValidationError: { description: Invalid parameter, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited:
      description: Too many requests from this IP
      headers: { Retry-After: { schema: { type: integer, minimum: 1 } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable: { description: Database unreachable (service_unavailable) or clinic not configured (not_configured), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

    Unauthenticated: { description: "401 not_signed_in / session_expired", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    Forbidden: { description: "403 forbidden / demo_read_only / password_change_required / csrf_failed", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    Conflict: { description: "409 (see code)", content: { application/json: { schema: { $ref: "#/components/schemas/BookingChanged" } } } }
    Validation: { description: "422 validation_error / weak_password", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    AdminRateLimited: { description: "429 rate_limited / account_locked (Retry-After header)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  schemas:
    Slug: { type: string, minLength: 1, maxLength: 80, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
    Weekday: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
    HHMM: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
    Uuid: { type: string, format: uuid }
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [ok, unavailable] } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, enum: [not_found, method_not_allowed, validation_error, rate_limited, internal_error, service_unavailable, not_configured] }
            message: { type: string }
            requestId: { type: string }
            details:
              type: array
              items: { type: object, required: [field, issue], properties: { field: { type: string }, issue: { type: string } } }
    ImageAsset:
      type: object
      required: [src, alt, width, height]
      properties: { src: { type: string }, alt: { type: string }, width: { type: integer }, height: { type: integer } }
    PhoneNumber:
      type: object
      required: [display, tel]
      properties: { display: { type: string }, tel: { type: string } }
    OpeningHoursRule:
      type: object
      required: [days, opens, closes]
      properties: { days: { type: array, items: { $ref: "#/components/schemas/Weekday" } }, opens: { $ref: "#/components/schemas/HHMM" }, closes: { $ref: "#/components/schemas/HHMM" } }
    ClinicSettings:
      type: object
      required: [name, tagline, fullTitle, demoNotice, emergencyPhone, generalPhone, address, timeZone, openingHours, labHours, mapArea, credit, indexable, isSample, logo, brandColors]
      properties:
        name: { type: string }
        tagline: { type: string }
        fullTitle: { type: string }
        demoNotice: { type: string }
        emergencyPhone: { $ref: "#/components/schemas/PhoneNumber" }
        generalPhone: { $ref: "#/components/schemas/PhoneNumber" }
        address: { type: array, items: { type: string } }
        timeZone: { type: string, examples: [Asia/Karachi] }
        openingHours: { type: array, items: { $ref: "#/components/schemas/OpeningHoursRule" } }
        labHours: { type: array, items: { $ref: "#/components/schemas/OpeningHoursRule" } }
        mapArea:
          type: object
          required: [bbox, label]
          properties: { bbox: { type: array, items: { type: number }, minItems: 4, maxItems: 4 }, label: { type: string } }
        credit: { type: object, required: [text, href], properties: { text: { type: string }, href: { type: string, format: uri } } }
        indexable: { type: boolean }
        isSample: { type: boolean }
        logo: { $ref: "#/components/schemas/ImageAsset" }
        brandColors: { type: object, required: [primary, accent], properties: { primary: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }, accent: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" } } }
    ClinicRule:
      type: object
      required: [id, sortOrder, text, isSample]
      properties: { id: { $ref: "#/components/schemas/Uuid" }, sortOrder: { type: integer }, text: { type: string }, isSample: { type: boolean } }
    Department:
      type: object
      required: [id, slug, name, summary, image, sortOrder, overview, conditions, services, relatedTestSlugs, isSample]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        summary: { type: string }
        image: { $ref: "#/components/schemas/ImageAsset" }
        sortOrder: { type: integer }
        overview: { type: string }
        conditions: { type: array, items: { type: string } }
        services: { type: array, items: { type: string } }
        relatedTestSlugs: { type: array, items: { $ref: "#/components/schemas/Slug" } }
        isSample: { type: boolean }
    ScheduleSession:
      type: object
      required: [day, start, end, slotMinutes]
      properties:
        day: { $ref: "#/components/schemas/Weekday" }
        start: { $ref: "#/components/schemas/HHMM" }
        end: { $ref: "#/components/schemas/HHMM" }
        slotMinutes: { type: integer, minimum: 5, maximum: 120, description: additive }
    Doctor:
      type: object
      required: [id, slug, fullName, departmentId, specialty, photo, feePkr, qualifications, experienceYears, languages, bio, schedule, isFeatured, isSample]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        slug: { $ref: "#/components/schemas/Slug" }
        fullName: { type: string }
        departmentId: { $ref: "#/components/schemas/Uuid" }
        specialty: { type: string }
        photo: { $ref: "#/components/schemas/ImageAsset" }
        feePkr: { type: integer, minimum: 0 }
        qualifications: { type: array, items: { type: string } }
        experienceYears: { type: integer }
        languages: { type: array, items: { type: string, enum: [Urdu, English, Sindhi, Punjabi] } }
        bio: { type: string }
        schedule: { type: array, items: { $ref: "#/components/schemas/ScheduleSession" }, description: Included in list items too (the list page shows available days) }
        isFeatured: { type: boolean }
        isSample: { type: boolean }
    LabTestCategory:
      type: object
      required: [id, slug, name, iconName]
      properties: { id: { $ref: "#/components/schemas/Uuid" }, slug: { $ref: "#/components/schemas/Slug" }, name: { type: string }, iconName: { type: string } }
    LabTest:
      type: object
      required: [id, slug, name, alsoKnownAs, categoryId, pricePkr, sampleType, reportTime, preparation, homeCollection, about, relatedDepartmentIds, isSample]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        alsoKnownAs: { type: array, items: { type: string } }
        categoryId: { $ref: "#/components/schemas/Uuid" }
        pricePkr: { type: integer, minimum: 0 }
        sampleType: { type: string }
        reportTime: { type: string }
        preparation: { type: string }
        homeCollection: { type: boolean }
        about: { type: string }
        relatedDepartmentIds: { type: array, items: { $ref: "#/components/schemas/Uuid" } }
        isSample: { type: boolean }
    LabTestSummary:
      type: object
      required: [id, slug, name, pricePkr, homeCollection]
      properties: { id: { $ref: "#/components/schemas/Uuid" }, slug: { $ref: "#/components/schemas/Slug" }, name: { type: string }, pricePkr: { type: integer }, homeCollection: { type: boolean } }
    HealthPackage:
      type: object
      required: [id, slug, name, iconName, whoFor, testSlugs, packagePricePkr, preparation, homeCollection, isSample]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        iconName: { type: string }
        whoFor: { type: string }
        testSlugs: { type: array, items: { $ref: "#/components/schemas/Slug" } }
        packagePricePkr: { type: integer, minimum: 0 }
        preparation: { type: string }
        homeCollection: { type: boolean }
        isSample: { type: boolean }
    HealthPackageDetail:
      allOf:
        - $ref: "#/components/schemas/HealthPackage"
        - type: object
          required: [tests]
          properties: { tests: { type: array, items: { $ref: "#/components/schemas/LabTestSummary" }, description: additive; same order as testSlugs } }
    PageMeta:
      type: object
      required: [total, page, pageSize]
      properties: { total: { type: integer }, page: { type: integer }, pageSize: { type: integer } }
    ClinicRulePage: { allOf: [ { $ref: "#/components/schemas/PageMeta" }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ClinicRule" } } } } ] }
    LabTestCategoryPage: { allOf: [ { $ref: "#/components/schemas/PageMeta" }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/LabTestCategory" } } } } ] }
    DepartmentPage: { allOf: [ { $ref: "#/components/schemas/PageMeta" }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Department" } } } } ] }
    DoctorPage: { allOf: [ { $ref: "#/components/schemas/PageMeta" }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Doctor" } } } } ] }
    LabTestPage: { allOf: [ { $ref: "#/components/schemas/PageMeta" }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/LabTest" } } } } ] }
    HealthPackagePage: { allOf: [ { $ref: "#/components/schemas/PageMeta" }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/HealthPackage" } } } } ] }
    ErrorInfo:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string, enum: [not_found, method_not_allowed, validation_error, rate_limited, internal_error, service_unavailable, not_configured, forbidden, request_rejected, slot_taken, slot_unavailable, booking_limit_reached, idempotency_key_reused, not_signed_in, session_expired, sign_in_failed, account_locked, csrf_failed, demo_read_only, password_change_required, weak_password, email_taken, last_admin, transition_not_allowed, booking_changed, undo_unavailable] }
        message: { type: string }
        requestId: { type: string }
        retryAfterSeconds: { type: integer }
        details:
          type: array
          items: { type: object, required: [field, issue], properties: { field: { type: string }, issue: { type: string } } }
    Slot:
      type: object
      required: [startsAt, endsAt, localTime]
      properties:
        startsAt: { type: string, format: date-time, description: UTC instant }
        endsAt: { type: string, format: date-time }
        localTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
    AlternativeSlot:
      type: object
      required: [startsAt, endsAt, localDate, localTime]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        localDate: { type: string, format: date }
        localTime: { type: string }
    SlotDay:
      type: object
      required: [date, weekday, status, slots]
      properties:
        date: { type: string, format: date }
        weekday: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
        status: { type: string, enum: [available, fully_booked, doctor_unavailable, clinic_closed, not_working, no_longer_available] }
        holidayName: { type: string, description: Only when status is clinic_closed }
        slots: { type: array, items: { $ref: "#/components/schemas/Slot" }, description: Available slots only, ascending }
    DoctorSlots:
      type: object
      required: [doctorSlug, timeZone, windowDays, generatedAt, days]
      properties:
        doctorSlug: { type: string }
        timeZone: { type: string }
        windowDays: { type: integer }
        generatedAt: { type: string, format: date-time }
        days: { type: array, items: { $ref: "#/components/schemas/SlotDay" } }
    AppointmentCreate:
      type: object
      additionalProperties: false
      required: [doctorSlug, startsAt, fullName, mobile, acceptRules]
      properties:
        doctorSlug: { type: string, maxLength: 80 }
        startsAt: { type: string, format: date-time }
        fullName: { type: string, minLength: 2, maxLength: 80 }
        mobile: { type: string, maxLength: 20, description: Pakistani mobile; normalized to +923XXXXXXXXX }
        email: { type: [string, "null"], maxLength: 254 }
        reason: { type: [string, "null"], maxLength: 300 }
        acceptRules: { type: boolean, const: true }
        trap: { type: [string, "null"], maxLength: 200, description: Honeypot; must be empty }
    AppointmentView:
      type: object
      required: [reference, status, doctor, department, startsAt, endsAt, localDate, localTime, timeZone, feePkr, patientNameMasked, mobileMasked, bookedAt, isSample]
      properties:
        reference: { type: string, description: "Display form XXXXX-XXXXX" }
        status: { type: string, enum: [confirmed, cancelled, completed] }
        doctor:
          type: object
          required: [slug, fullName, specialty]
          properties: { slug: { type: string }, fullName: { type: string }, specialty: { type: string } }
        department:
          type: object
          required: [slug, name]
          properties: { slug: { type: string }, name: { type: string } }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        localDate: { type: string, format: date }
        localTime: { type: string }
        timeZone: { type: string }
        feePkr: { type: integer }
        patientNameMasked: { type: string, examples: ["A**** K****"] }
        mobileMasked: { type: string, examples: ["0300****567"] }
        bookedAt: { type: string, format: date-time, description: When the booking was made }
        isSample: { type: boolean }
    BookingConflict:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorInfo" }
        alternatives: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/AlternativeSlot" } }
    ErrorResponse:
      type: object
      required: [error]
      properties: { error: { $ref: "#/components/schemas/ErrorInfo" } }
    Role: { type: string, enum: [admin, receptionist] }
    BookingStatus: { type: string, enum: [confirmed, arrived, completed, no_show, cancelled] }

    Viewer:
      type: object
      required: [kind, csrfToken, clinicToday, timezone]
      properties:
        kind: { type: string, enum: [staff, demo] }
        role: { $ref: "#/components/schemas/Role", description: "staff only" }
        displayName: { type: string }
        mustChangePassword: { type: boolean }
        csrfToken: { type: string }
        clinicToday: { type: string, format: date, description: "staff: today in clinic time; demo: the session's demo date" }
        timezone: { type: string, example: Asia/Karachi }
        sessionExpiresAt: { type: string, format: date-time, description: "earlier of idle and absolute expiry" }
    SignInRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string, maxLength: 254 }, password: { type: string, maxLength: 128 } }
    SessionIssued:
      description: Returned to the website server only. The BFF moves `token` into the cookie and strips it from the browser response.
      type: object
      required: [token, viewer]
      properties: { token: { type: string }, viewer: { $ref: "#/components/schemas/Viewer" } }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties: { currentPassword: { type: string, maxLength: 128 }, newPassword: { type: string, minLength: 12, maxLength: 128 } }

    Trend:
      type: object
      required: [value, previous, delta, comparedTo]
      properties:
        value: { type: [integer, "null"] }
        previous: { type: [integer, "null"] }
        delta: { type: [integer, "null"] }
        comparedTo: { type: string, format: date }
    Overview:
      type: object
      required: [localDate, now, kpis, agenda, nextUp, isSample]
      properties:
        localDate: { type: string, format: date }
        now: { type: string, format: date-time }
        clinicClosed: { type: [string, "null"], description: holiday name when closed }
        kpis:
          type: object
          required: [appointments, arrived, completed, noShows, cancellations, utilisationPct]
          properties:
            appointments: { $ref: "#/components/schemas/Trend" }
            arrived: { $ref: "#/components/schemas/Trend" }
            completed: { $ref: "#/components/schemas/Trend" }
            noShows: { $ref: "#/components/schemas/Trend" }
            cancellations: { $ref: "#/components/schemas/Trend" }
            utilisationPct: { $ref: "#/components/schemas/Trend" }
        agenda:
          type: array
          items:
            type: object
            required: [doctor, items]
            properties:
              doctor: { $ref: "#/components/schemas/DoctorRef" }
              items: { type: array, items: { $ref: "#/components/schemas/BookingSummary" } }
        nextUp: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/BookingSummary" } }
        recentBookings:
          type: array
          maxItems: 5
          description: >-
            The most recently created bookings (any appointment date), newest first (FR-042). The client polls this
            endpoint every 30 s (FR-041) and shows a notification for each item whose bookedAt is later than the newest
            it has already seen; on first load it only records the newest bookedAt. Demo: always empty (the browser
            simulates new bookings itself).
          items:
            allOf:
              - $ref: "#/components/schemas/BookingSummary"
              - type: object
                required: [bookedAt]
                properties: { bookedAt: { type: string, format: date-time } }
        isSample: { type: boolean }
    DoctorRef:
      type: object
      required: [id, name, departmentName]
      properties: { id: { type: string, format: uuid }, name: { type: string }, departmentName: { type: string }, isActive: { type: boolean } }
    BookingSummary:
      type: object
      required: [reference, startsAt, endsAt, localDate, localTime, status, version, patientNameMasked, phoneMasked, doctor, allowedNext]
      properties:
        reference: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        localDate: { type: string, format: date }
        localTime: { type: string }
        status: { $ref: "#/components/schemas/BookingStatus" }
        version: { type: integer }
        patientNameMasked: { type: string, example: "Ayesha K." }
        phoneMasked: { type: string, example: "0300****567" }
        doctor: { $ref: "#/components/schemas/DoctorRef" }
        allowedNext: { type: array, items: { $ref: "#/components/schemas/BookingStatus" }, description: "server-computed with the clock (FR-023/024)" }
        isSample: { type: boolean }
    BookingDetail:
      allOf:
        - $ref: "#/components/schemas/BookingSummary"
        - type: object
          required: [patientName, feePkr, bookedAt, history]
          properties:
            patientName: { type: string }
            emailMasked: { type: [string, "null"] }
            reason: { type: [string, "null"] }
            patientAge: { type: integer, description: "Pediatrics (demo sample data): the child's age" }
            bookedBy: { type: string, description: "Pediatrics (demo sample data): mother or father" }
            feePkr: { type: integer }
            bookedAt: { type: string, format: date-time }
            history:
              type: array
              items:
                type: object
                required: [at, toStatus, actor, isUndo]
                properties:
                  at: { type: string, format: date-time }
                  fromStatus: { oneOf: [ { $ref: "#/components/schemas/BookingStatus" }, { type: "null" } ] }
                  toStatus: { $ref: "#/components/schemas/BookingStatus" }
                  actor: { type: string, description: "staff display name or 'Online booking'" }
                  isUndo: { type: boolean }
    BookingSearchRequest:
      type: object
      properties:
        q: { type: string, maxLength: 80, description: reference or patient name; never logged }
        from: { type: string, format: date }
        to: { type: string, format: date }
        doctorId: { type: string, format: uuid }
        departmentId: { type: string, format: uuid }
        statuses: { type: array, items: { $ref: "#/components/schemas/BookingStatus" } }
        page: { type: integer, minimum: 1, default: 1 }
    BookingPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BookingSummary" } }
        total: { type: integer }
        statusCounts: { type: object, additionalProperties: { type: integer }, description: "bookings per status for the same filters, ignoring the status filter (the chips)" }
        page: { type: integer }
        pageSize: { type: integer, const: 20 }
    StatusChangeRequest:
      type: object
      required: [to, expectedVersion]
      properties: { to: { $ref: "#/components/schemas/BookingStatus" }, expectedVersion: { type: integer } }
    StatusChangeResult:
      type: object
      required: [booking, changeId, undoExpiresAt]
      properties:
        booking: { $ref: "#/components/schemas/BookingDetail" }
        changeId: { type: string, format: uuid }
        undoExpiresAt: { type: string, format: date-time }
    UndoRequest:
      type: object
      required: [changeId]
      properties: { changeId: { type: string, format: uuid } }
    BookingChanged:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorInfo" }
        latest: { $ref: "#/components/schemas/BookingDetail" }
    PhoneReveal:
      type: object
      required: [phone, telHref, maskAfterSeconds]
      properties: { phone: { type: string, example: "0300 1234567" }, telHref: { type: string }, maskAfterSeconds: { type: integer, const: 60 } }

    Insights:
      type: object
      required: [rangeDays, from, to, perDay, byDepartment, byStatus, byHour, total, isSample]
      properties:
        rangeDays: { type: integer, enum: [7, 30, 90] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        total: { type: integer }
        perDay: { type: array, items: { type: object, required: [date, count], properties: { date: { type: string, format: date }, count: { type: integer } } } }
        byDepartment: { type: array, items: { type: object, required: [departmentName, count, cancelled], properties: { departmentName: { type: string }, count: { type: integer }, cancelled: { type: integer } } } }
        byStatus: { type: array, items: { type: object, required: [status, count], properties: { status: { $ref: "#/components/schemas/BookingStatus" }, count: { type: integer } } } }
        byHour: { type: array, items: { type: object, required: [hour, count], properties: { hour: { type: integer, minimum: 0, maximum: 23 }, count: { type: integer } } } }
        isSample: { type: boolean }
    DoctorsToday:
      type: object
      required: [localDate, working, onLeave, notIn]
      properties:
        localDate: { type: string, format: date }
        clinicClosed: { type: [string, "null"] }
        working:
          type: array
          items:
            type: object
            required: [doctor, sessions, scheduled, booked, free, utilisationPct]
            properties:
              doctor: { $ref: "#/components/schemas/DoctorRef" }
              sessions: { type: array, items: { type: object, properties: { start: { type: string }, end: { type: string } } } }
              scheduled: { type: integer }
              booked: { type: integer }
              free: { type: integer }
              freePassed: { type: integer }
              utilisationPct: { type: integer }
              nextFree: { type: [string, "null"], description: local HH:MM }
        onLeave: { type: array, items: { $ref: "#/components/schemas/DoctorRef" } }
        notIn: { type: array, items: { $ref: "#/components/schemas/DoctorRef" } }
    ActivityEvent:
      type: object
      required: [id, at, action, outcome]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        action: { type: string }
        outcome: { type: string }
        actorName: { type: [string, "null"] }
        actorRole: { type: [string, "null"] }
        bookingReference: { type: [string, "null"] }
        fromStatus: { type: [string, "null"] }
        toStatus: { type: [string, "null"] }
        networkTag: { type: string, description: first 6 chars of the keyed IP fingerprint }
        isSample: { type: boolean }
    ActivityPage:
      type: object
      required: [items, total, page, pageSize]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/ActivityEvent" } }, total: { type: integer }, page: { type: integer }, pageSize: { type: integer } }
    Staff:
      type: object
      required: [id, email, displayName, role, isActive]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        jobTitle: { type: string, description: "Sample staff only: the role title shown on the demo staff list." }
        role: { $ref: "#/components/schemas/Role" }
        isActive: { type: boolean }
        mustChangePassword: { type: boolean }
        lastSignInAt: { type: [string, "null"], format: date-time }
        isSample: { type: boolean }
    StaffCreate:
      type: object
      required: [email, displayName, role, temporaryPassword]
      properties: { email: { type: string }, displayName: { type: string }, role: { $ref: "#/components/schemas/Role" }, temporaryPassword: { type: string, minLength: 12, maxLength: 128 } }
    Lookups:
      type: object
      required: [doctors, departments]
      properties:
        doctors: { type: array, items: { $ref: "#/components/schemas/DoctorRef" } }
        departments: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string }, isActive: { type: boolean } } } }
